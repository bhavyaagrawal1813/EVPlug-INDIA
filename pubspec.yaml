name: evplug_new
description: "EVPlug - Find nearby EV charging stations, save favorites, add community chargers, and get AI-powered charging assistance."
publish_to: 'none'

version: 1.0.15+16

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  google_sign_in: 6.2.1
  shared_preferences: ^2.5.0

  geolocator: ^13.0.4
  google_maps_flutter: ^2.12.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.0
  share_plus: ^10.0.2
  flutter_markdown: ^0.7.3

  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - lib/images/google_logo.png
    - lib/images/evplug_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/evplug_logo.png"
  adaptive_icon_background: "#030712"
  adaptive_icon_foreground: "lib/images/evplug_logo.png"
  min_sdk_android: 21